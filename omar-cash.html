<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دفتر الشغل</title>
<meta name="theme-color" content="#10283A">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F4;--card:#fff;--tx:#10222E;--mut:#64757F;--pri:#10283A;--pri2:#E4EAEE;--gold:#B98A3E;--ok:#1F7A5A;--ok2:#E1F1EA;--bad:#B3392F;--bad2:#F8E1DE;--warn:#9A6A12;--warn2:#F8EBCF;--bd:#DCE3E7}
@media (prefers-color-scheme:dark){:root{--bg:#0B1418;--card:#131F26;--tx:#EAF0F2;--mut:#8FA2AC;--pri:#2B4B63;--pri2:#1B2B35;--gold:#D4A85A;--ok:#4DBE98;--ok2:#14332B;--bad:#EE7468;--bad2:#3A1E1B;--warn:#E3B04F;--warn2:#3A2D12;--bd:#243640}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',Cairo,Tahoma,sans-serif;font-size:15px;line-height:1.55;min-height:100%;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:4;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin:0 -14px 14px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.brand i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--pri);color:#fff;font-size:16px}
.seg{display:flex;gap:6px;align-items:center}
.seg button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;font:inherit;font-size:13px;font-weight:600;border-radius:99px;cursor:pointer}
.seg .on{background:var(--pri);color:#fff;border-color:var(--pri)}
h1{font-size:22px;font-weight:700;margin:6px 0 4px}.sub{color:var(--mut);margin:0 0 14px}
h2{font-size:16px;font-weight:700;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gold)}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#fff;margin-bottom:14px;background:linear-gradient(135deg,#10283A,#183F59);box-shadow:0 10px 24px -12px rgba(16,40,58,.6)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 100% 0,transparent 0 14px,rgba(255,255,255,.045) 14px 15px);pointer-events:none}
.hero::after{content:"";position:absolute;inset-inline:20px;bottom:0;height:3px;background:var(--gold);border-radius:3px 3px 0 0}
.hero>*{position:relative}
.hl{display:block;font-size:13px;opacity:.75}
.hero>b{display:block;font-size:34px;font-weight:700;margin:2px 0 14px}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
.hs span{display:block;font-size:12px;opacity:.7}.hs b{font-size:17px}
.mic{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:18px;padding:18px 10px;cursor:pointer;margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:right;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:16px;padding:14px;font:inherit;cursor:pointer;min-height:92px}
.big:active{background:var(--pri2)}
.big i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--pri2);font-size:19px;margin-bottom:6px}
.big b{font-size:15px;font-weight:700}.big small{color:var(--mut);font-size:12px}
.big.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px}.big.full i{margin:0}.big.full div{display:flex;flex-direction:column}
.closebtn{width:100%;margin-bottom:14px;border:1px dashed var(--bd);background:transparent;color:var(--mut);border-radius:14px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.warnbox{background:var(--warn2);border:1px solid var(--gold)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px}
.card b{display:block;font-size:20px;font-weight:700}.card span{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.grid .card{display:flex;flex-direction:column-reverse;gap:4px}
.sheet{position:fixed;inset:0;background:rgba(8,18,26,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet>div{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--bd);margin:6px auto 4px}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet>div{animation:none}}
textarea,input,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
textarea:focus,input:focus,select:focus,.btn:focus-visible,.big:focus-visible,.mic:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.item{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:6px;margin:8px 0;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.x{background:transparent;color:var(--bad);padding:6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.tblw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:right;padding:10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--pri2);color:var(--mut);font-weight:600;font-size:12.5px}tr:last-child td{border-bottom:0}
details{margin:8px 0}summary{cursor:pointer;list-style:none;padding:12px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px}summary::-webkit-details-marker{display:none}summary small{color:var(--mut);font-weight:500}details[open]>summary{border-radius:14px 14px 0 0}details[open]>.tblw{border-top:0;border-radius:0 0 14px 14px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.pill{padding:2px 10px;border-radius:99px;background:var(--ok2);color:var(--ok);font-size:12.5px;font-weight:600;white-space:nowrap}.pill.bad{background:var(--bad2);color:var(--bad)}.pill.warn{background:var(--warn2);color:var(--warn)}
.msg{padding:12px 14px;border-radius:12px;background:var(--ok2);margin:10px 0}.msg.neg{background:var(--bad2)}
.note{color:var(--mut);font-size:13px}
.login{max-width:380px;margin:9vh auto;display:grid;gap:12px;text-align:center}
.logo{width:64px;height:64px;margin:0 auto;border-radius:18px;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#10283A,#183F59);box-shadow:0 8px 20px -10px #10283A}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,onSnapshot,writeBatch,doc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const cfg={apiKey:"AIzaSyACXQm-gBg0MZY0mGIveAS5WNie_hj2OaU",authDomain:"omar-cf536.firebaseapp.com",projectId:"omar-cf536",storageBucket:"omar-cf536.firebasestorage.app",messagingSenderId:"898179691911",appId:"1:898179691911:web:8b4ea316450bbd31b8cf22"};
const ADMIN_EMAIL='ziad@gmail.com';
const app=initializeApp(cfg),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

/* ===== الحالة ===== */
const L={entries:[],cust:{},ph:{},del:[],close:{},closeErr:'',pending:false,cache:false,ready:false};
const S={user:null,role:null,view:'assistant',sheet:null,draft:[],text:'',msg:'',rec:null,err:'',dirty:false,topup:{},day:''};
let unsubs=[];
const fmt=n=>(n/100).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID();
const DESTS=['كاش','فودافون كاش','خط','تحويل بنكي','إنستاباي'];
const TYPES={collection:'تحصيل',debt:'مديونية',handover:'تسليم لأبو عدي',abuReturn:'استرداد من أبو عدي',abuOdayExpense:'مصروف أبو عدي'};

/* ===== محاسبة: كل الأرصدة من القيود ===== */
const k=e=>e.kind==='reversal'?e.origKind:e.kind;
const sg=e=>e.sign*e.amount;
const bal=a=>L.entries.filter(e=>e.account===a&&e.status==='confirmed').reduce((s,e)=>s+sg(e),0);
const sumF=(f,m=sg)=>L.entries.filter(f).reduce((s,e)=>s+m(e),0);
function custInfo(id){const a='customer:'+id,es=L.entries.filter(e=>e.account===a);
  const debt=es.filter(e=>['debt','opening'].includes(k(e))).reduce((s,e)=>s+sg(e),0);
  const paid=es.filter(e=>k(e)==='collection').reduce((s,e)=>s-sg(e),0);
  return{debt,paid,rem:bal(a)}}
function abu(){const A=e=>e.account==='abuOdayCash';
  const rec=sumF(e=>A(e)&&k(e)==='handover'),sp=sumF(e=>A(e)&&k(e)==='abuOdayExpense'&&e.status==='confirmed',e=>-sg(e)),
  rp=sumF(e=>e.kind==='abuOdayExpense'&&e.status!=='confirmed',e=>e.amount),b=bal('abuOdayCash');
  const st=b<0?['عجز يحتاج مراجعة','bad']:rp>0?['توجد عمليات معلقة','warn']:b===0?['متزن','']:['يوجد رصيد متبقٍ','warn'];const ret=sumF(e=>A(e)&&k(e)==='abuReturn',e=>-sg(e));return{rec,sp,rp,b,st,ret}}
const dayKey=d=>new Date(d).toLocaleDateString('en-CA');

/* ===== الكتابة (ذرية + منع تكرار بمعرّف العملية) ===== */
async function post(op){
  if(L.entries.some(e=>e.opId===op.opId))return{ok:true,dup:true};
  if(!Number.isInteger(op.amount)||op.amount<=0)return{ok:false,warn:['المبلغ غير صالح']};
  const w=[],at=new Date().toISOString();
  const mk=(kind,account,sign,x={})=>({opId:op.opId,kind,account,amount:op.amount,sign,party:op.party||'',status:'confirmed',note:op.note||'',at,by:auth.currentUser.uid,byEmail:auth.currentUser.email,source:op.source||'manual',voiceText:op.voiceText||'',dest:op.dest||'',ts:serverTimestamp(),...x});
  let out=[];
  if(op.kind==='debt')out=[mk('debt','customer:'+op.cid,1)];
  else if(op.kind==='collection'){const r=bal('customer:'+op.cid);if(op.amount>r)w.push('المبلغ أكبر من المتبقي على العميل ('+fmt(r)+')');out=[mk('collection','customer:'+op.cid,-1),mk('collection','assistantCash',1)]}
  else if(op.kind==='handover'){const c=bal('assistantCash');if(op.amount>c)w.push('التسليم أكبر من عهدة المساعد المسجلة ('+fmt(c)+')');out=[mk('handover','assistantCash',-1),mk('handover','abuOdayCash',1)]}
  else if(op.kind==='abuReturn'){const c=bal('abuOdayCash');if(op.amount>c)w.push('الاسترداد أكبر من رصيد خزنة أبو عدي ('+fmt(c)+')');out=[mk('abuReturn','abuOdayCash',-1),mk('abuReturn','assistantCash',1)]}
  else if(op.kind==='abuOdayExpense'){const st=op.status||'confirmed';if(st==='confirmed'&&op.amount>bal('abuOdayCash'))w.push('المصروف أكبر من رصيد خزنة أبو عدي ('+fmt(bal('abuOdayCash'))+')');out=[mk('abuOdayExpense','abuOdayCash',-1,{status:st})]}
  else if(op.kind==='opening')out=[mk('opening',op.account,1)];
  if(w.length&&!op.approved)return{ok:false,warn:w};
  const b=writeBatch(db);
  out.forEach((e,i)=>b.set(doc(db,'entries',op.opId+'_'+i),{...e,n:i}));
  if(op.newCust)b.set(doc(db,'customers',op.cid),{name:op.party,phone:op.phone||'',at});
  return commit(b);
}
async function commit(b){const p=b.commit();p.catch(e=>alert('فشل الحفظ ويحتاج إعادة المحاولة: '+(e.code||e.message)));
  const r=await Promise.race([p.then(()=>'ok',()=>'fail'),new Promise(r=>setTimeout(()=>r('pending'),4000))]);
  return r==='fail'?{ok:false,warn:['فشل الحفظ']}:{ok:true,pending:r==='pending'}}
async function reverseOp(opId){if(L.entries.some(e=>e.opId==='rev-'+opId))return;
  const es=L.entries.filter(e=>e.opId===opId);if(!es.length||!confirm('عكس هذه العملية بقيد تصحيحي؟'))return;
  const b=writeBatch(db),at=new Date().toISOString();
  es.forEach((e,i)=>{const{n,...r}=e;b.set(doc(db,'entries','rev-'+opId+'_'+i),{...r,kind:'reversal',origKind:e.kind,opId:'rev-'+opId,sign:-e.sign,note:'تصحيح',at,ts:serverTimestamp(),by:auth.currentUser.uid,byEmail:auth.currentUser.email,n:i})});
  await commit(b)}
window.reverseOp=reverseOp;

/* ===== محلل كلام مبسّط (الذكاء الاصطناعي لاحقًا) ===== */
const W={'واحد':1,'اتنين':2,'اثنين':2,'تلات':3,'تلاتة':3,'ثلاثة':3,'اربع':4,'اربعة':4,'خمس':5,'خمسة':5,'ستة':6,'سبع':7,'سبعة':7,'تمن':8,'تمانية':8,'تسع':9,'تسعة':9,'عشرة':10,'احداشر':11,'اتناشر':12,'تلتاشر':13,'اربعتاشر':14,'خمستاشر':15,'ستاشر':16,'سبعتاشر':17,'تمنتاشر':18,'تسعتاشر':19,'عشرين':20,'تلاتين':30,'اربعين':40,'خمسين':50,'ستين':60,'سبعين':70,'تمانين':80,'تسعين':90,'مية':100,'ميتين':200,'تلتمية':300,'تلاتمية':300,'ربعمية':400,'اربعمية':400,'خمسمية':500,'ستمية':600,'سبعمية':700,'تمنمية':800,'تمانمية':800,'تسعمية':900};
const NW={};for(const w in W)NW[w.replace(/ة/g,'ه')]=W[w];
const ND=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/٬/g,',');
const isNum=z=>NW[z]!==undefined||/^(الفين|الف|الاف)$/.test(z);
function parseAmt(t){t=ND(t.replace(/[أإآ]/g,'ا').replace(/،/g,'')).replace(/ة/g,'ه').replace(/ى/g,'ي');
  const m=t.match(/(\d[\d,.]*\d|\d)\s*(الف|الاف)?/);
  if(m){let n=parseFloat(m[1].replace(/,/g,''));if(m[2])n*=1000;return Math.round(n*100)}
  let tot=0,cur=0,f=false;for(const x of t.split(/\s+/)){const w=isNum(x)?x:x.replace(/^و/,'');
    if(NW[w]!==undefined){cur+=NW[w];f=true}else if(w==='الفين'){tot+=2000;f=true}else if(w==='الف'||w==='الاف'){tot+=(cur||1)*1000;cur=0;f=true}}
  return f?(tot+cur)*100:null}
function parse(text){text=ND(text.replace(/[أإآ]/g,'ا')).replace(/(\d),(?=\d{3}(?!\d))/g,'$1');
  const segs=text.split(/[،\n]+|[,.](?!\d)|\s(?:و)?(?=خدت|سلمت|صرفت|اديت|استلمت)|\sو(?=\S+\s+(?:خدت|دفع|سلمت|صرف|عليه))/).map(s=>s.trim()).filter(Boolean),out=[];
  for(const s of segs){const n=s,q=s.replace(/ة/g,'ه').replace(/ى/g,'ي');let type=null,person='',m;
    if(/ابو عدي/.test(q)&&/رجع|استرد|(?:خدت|استلمت|اخدت) من/.test(q))type='abuReturn';
    else if(/ابو عدي/.test(q)&&/سلمت|اديت/.test(q)&&!/صرف/.test(q))type='handover';
    else if(/صرف/.test(q)){type='abuOdayExpense';m=n.match(/\sل\s*([\u0600-\u06FF]+)/)||n.match(/^ل([\u0600-\u06FF]+)/);person=m?m[1]:''}
    else if(/عليه|مديونيه|(?:^|\s)دين(?:\s|$)/.test(q)){type='debt';m=n.match(/^\s*([\u0600-\u06FF]+)\s+عليه/);person=m?m[1]:''}
    else if(/خدت|استلمت|دفع|حصلت|جبت/.test(q)){type='collection';m=n.match(/من\s+([\u0600-\u06FF]+)/)||n.match(/^\s*([\u0600-\u06FF]+)\s+دفع/);person=m?m[1]:''}
    if(type)out.push({type,person:['handover','abuReturn'].includes(type)?'أبو عدي':person,amt:parseAmt(s),id:uid()})}
  return out}

/* ===== الواجهة ===== */
function render(){const a=document.getElementById('app');
  if(!S.user){a.innerHTML=`<div class="login"><div class="logo">📒</div><h1>دفتر الشغل</h1><p class="sub">سجّل دخولك للمتابعة</p><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button class="btn" onclick="login()">دخول</button>${S.err?`<div class="msg neg">${esc(S.err)}</div>`:''}</div>`;return}
  const isAdmin=S.role==='admin',sync=!L.ready&&!S.err?['جاري التحميل…','warn']:L.pending?['في انتظار المزامنة','warn']:(L.cache&&!navigator.onLine)?['بدون اتصال','warn']:['تمت المزامنة',''];
  a.innerHTML=`<div class="top"><div class="brand"><i>📒</i>دفتر الشغل</div><span class="pill ${sync[1]}">${sync[0]}</span><div class="seg">${isAdmin?`<button class="${S.view==='assistant'?'on':''}" onclick="S.view='assistant';render()">المساعد</button><button class="${S.view==='admin'?'on':''}" onclick="S.view='admin';render()">المدير</button>`:''}<button onclick="logout()">خروج</button></div></div>`+(S.err?'<div class="msg neg">'+esc(S.err)+'</div>':'')+(!L.ready&&!S.err?'<p class="msg">جاري تحميل البيانات…</p>':isAdmin&&S.view==='admin'?admin():assistant())+(S.sheet?sheet():'')}
window.render=render;window.S=S;
function assistant(){const td=dayKey(new Date()),T=L.entries.filter(e=>dayKey(e.at)===td);
  const col=T.filter(e=>e.account==='assistantCash'&&k(e)==='collection').reduce((s,e)=>s+sg(e),0),hand=T.filter(e=>e.account==='abuOdayCash'&&k(e)==='handover').reduce((s,e)=>s+sg(e),0);
  const rev=T.filter(e=>e.n===0&&TYPES[e.kind]).length;
  return `<section class="hero"><span class="hl">تحصيل اليوم</span><b>${fmt(col)}</b><div class="hs"><div><span>اتسلّم لأبو عدي</span><b>${fmt(hand)}</b></div><div><span>عدد الحركات</span><b>${rev}</b></div></div></section>
  ${closeBox()}
  <button class="mic" onclick="openSheet('voice')">🎙️ سجّل بالصوت</button>
  <div class="row"><button class="big" onclick="openSheet('collection')"><i>💰</i><b>تحصيل</b><small>من عميل</small></button><button class="big" onclick="openSheet('handover')"><i>💵</i><b>تسليم</b><small>لأبو عدي</small></button><button class="big" onclick="openSheet('distribute')"><i>📤</i><b>توزيع</b><small>مصروفات أبو عدي</small></button><button class="big" onclick="openSheet('customers')"><i>👥</i><b>العملاء</b><small>الأرصدة والبحث</small></button><button class="big full" onclick="openSheet('abuReturn')"><i>↩️</i><div><b>استرداد من أبو عدي</b><small>فلوس رجعتلك منه</small></div></button><button class="big full" onclick="openSheet('today')"><i>📋</i><div><b>حركات اليوم</b><small>${rev} عملية النهارده</small></div></button></div>`}
function admin(){const ci=Object.keys(L.cust).map(i=>({n:L.cust[i],p:L.ph[i]||'',id:i,...custInfo(i)})).sort((a,b)=>b.rem-a.rem),A=abu();
  const totDebt=ci.reduce((s,c)=>s+c.debt,0),totRem=ci.reduce((s,c)=>s+c.rem,0),today=dayKey(new Date());

  const rowsBy={};L.entries.slice().reverse().forEach(e=>{(rowsBy[dayKey(e.at)]=rowsBy[dayKey(e.at)]||[]).push(`<tr><td>${new Date(e.at).toLocaleString('ar-EG')}</td><td>${e.kind==='reversal'?'قيد عكسي':(TYPES[e.kind]||(e.kind==='opening'?'رصيد افتتاحي':e.kind))}</td><td>${esc(acct(e.account))}</td><td>${esc(e.party)}</td><td>${esc(e.dest)}</td><td class="${e.sign>0?'pos':'neg'}">${e.sign>0?'+':'−'}${fmt(e.amount)}</td><td>${e.status==='confirmed'?'مؤكد':'مُبلَّغ'}</td><td>${e.source==='voice'?'🎙️':'يدوي'}</td><td>${e.n===0&&e.kind!=='reversal'&&!L.entries.some(x=>x.opId==='rev-'+e.opId)?`<button class="btn x" onclick="reverseOp('${e.opId}')">عكس</button>`:''}${e.n===0?`<button class="btn x" onclick="delOp('${e.opId}')">🗑 حذف</button>`:''}</td></tr>`)});
  const rows=Object.keys(rowsBy).sort().reverse().map((key,i)=>`<details ${i===0?'open':''}><summary><span>${dayLbl(key)}</span><small>${L.entries.filter(e=>e.n===0&&dayKey(e.at)===key).length} عملية</small></summary><div class="tblw"><table><tr><th>الوقت</th><th>النوع</th><th>الحساب</th><th>الطرف</th><th>الوجهة</th><th>المبلغ</th><th>الحالة</th><th>المصدر</th><th></th></tr>${rowsBy[key].join('')}</table></div></details>`).join('');

  ${A.rp>0?`<div class="msg">مصروفات مُبلَّغ عنها وغير مؤكدة: ${fmt(A.rp)}</div>`:''}
  <div class="bar"><button class="btn" onclick="openTopup('')">💵 إضافة فلوس على عملاء موجودين</button> <button class="btn sec" onclick="openSheet('bulkcust')">➕ عملاء جداد ومديونياتهم</button> <button class="btn sec" onclick="openSheet('opening')">رصيد افتتاحي للعهدة/الخزنة</button> <button class="btn sec" onclick="exportCSV()">⬇️ تصدير نسخة (Excel)</button> <button class="btn x" onclick="delAll()">🗑 مسح كل البيانات</button></div>
  ${dailyLog()}${abuStmt()}<h2>العملاء</h2><div class="tblw"><table><tr><th>العميل</th><th>الهاتف</th><th>المديونية</th><th>المدفوع</th><th>المتبقي</th><th></th></tr>${ci.map(c=>`<tr><td><button class="btn x" style="color:var(--tx);font-weight:700" onclick="openCust('${c.id}')">${esc(c.n)}</button></td><td>${esc(c.p)}</td><td>${fmt(c.debt)}</td><td>${fmt(c.paid)}</td><td><b>${fmt(c.rem)}</b></td><td><button class="btn x" style="color:var(--pri)" onclick="openTopup('${c.id}')">➕ فلوس</button><button class="btn x" onclick="delCust('${c.id}')">🗑 حذف</button></td></tr>`).join('')||'<tr><td colspan="6" class="note">لا يوجد عملاء بعد</td></tr>'}</table></div>
  <h2>سجل الحركات يوم بيوم</h2>${rows||'<p class="note">لا توجد حركات</p>'}
  ${delLog()}<p class="note">«عكس» يلغي الأثر ويُبقي الأصل ظاهرًا، و«حذف» يمسح نهائيًا بلا رجوع.</p>`}
function sheet(){let b='';
  if(S.sheet==='today'){const td=dayKey(new Date()),me=auth.currentUser.uid,t=L.entries.filter(e=>dayKey(e.at)===td&&e.n===0&&TYPES[e.kind]).reverse();

  else if(S.sheet==='customers'){b=`<h2>العملاء</h2><input placeholder="ابحث بالاسم أو الرقم" oninput="searchC(this.value)"><div id="cl">${custList()}</div><br><button class="btn sec" onclick="closeSheet()">إغلاق</button>`}
  else if(S.sheet==='bulkcust'){b=!S.bulk?`<h2>إضافة عملاء ومديونياتهم</h2><p class="note">اكتب كل شخص في سطر: الاسم ثم المبلغ المتبقي عليه (ورقم الهاتف اختياري).<br>مثال:<br>أحمد سمير 20000<br>محمد علي 5000 01012345678<br>محمود 0</p><textarea id="bc" rows="8"></textarea><br><br><button class="btn" onclick="bulkParse()">راجع</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`:`<h2>راجع قبل الحفظ</h2>${S.bulk.map(r=>`<div class="card" style="margin:6px 0;display:flex;justify-content:space-between"><span>${esc(r.name)} <span class="note">${esc(r.ph)}</span></span><b>${fmt(r.amt)}</b></div>`).join('')}<p class="note">الإجمالي: ${fmt(S.bulk.reduce((s,r)=>s+r.amt,0))}</p><button class="btn" onclick="bulkSave()">حفظ الكل</button> <button class="btn sec" onclick="S.bulk=null;render()">رجوع</button>`}

    b=`<h2>${dayLbl(S.day)}</h2><div class="grid"><div class="card"><b class="pos">${fmt(d.col)}</b><span>اتلم</span></div><div class="card"><b>${fmt(d.hand)}</b><span>اتسلّم لأبو عدي</span></div><div class="card"><b class="neg">${fmt(d.sp)}</b><span>أبو عدي صرف${d.rp>0?' (+ '+fmt(d.rp)+' مُبلَّغ)':''}</span></div><div class="card"><b>${fmt(d.ret)}</b><span>اتسترد منه</span></div><div class="card"><b class="${d.bal<0?'neg':''}">${fmt(d.bal)}</b><span>رصيد أبو عدي آخر اليوم</span></div></div>${closeDetail(S.day)}<h2>حركات اليوم</h2>${t.map(e=>`<div class="card" style="margin:6px 0"><b>${esc(lb(e))}</b> — ${fmt(e.amount)} ${e.party?'— '+esc(e.party):''}${e.dest?' <span class="note">('+esc(e.dest)+')</span>':''}${e.status!=='confirmed'?' <span class="pill warn">مُبلَّغ</span>':''}<div class="note">${new Date(e.at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<p class="note">لا توجد حركات</p>'}<button class="btn sec" onclick="closeSheet()">إغلاق</button>`}
  else if(S.sheet==='close'){const key=dayKey(new Date()),c=L.close[key]||{},d=dayStats().find(x=>x.key===key)||{col:0,hand:0,sp:0,ret:0,bal:0};
    b=`<h2>قفل اليوم</h2><div class="grid"><div class="card"><b class="pos">${fmt(d.col)}</b><span>اتلم النهارده</span></div><div class="card"><b>${fmt(d.hand)}</b><span>اتسلّم لأبو عدي</span></div><div class="card"><b class="neg">${fmt(d.sp)}</b><span>أبو عدي صرف</span></div><div class="card"><b>${fmt(d.bal)}</b><span>رصيد أبو عدي</span></div></div>${L.closeErr?'<div class="msg neg">تنبيه: مفيش صلاحية لحفظ قفل اليوم ('+esc(L.closeErr)+'). اطلب من زياد يضيف الصلاحية.</div>':''}<p><b>1) خلصت حسابك مع أبو عدي؟</b></p><select id="cl_done"><option value="">اختر</option><option value="1" ${c.done===true?'selected':''}>أيوه، خلصت</option><option value="0" ${c.done===false?'selected':''}>لأ، لسه فيه فرق</option></select><p><b>2) الفلوس اللي معاك حوّلتها فين؟</b></p><textarea id="cl_note" rows="4" placeholder="مثال: حولت 5000 فودافون كاش لزياد، والباقي كاش معايا">${esc(c.note||'')}</textarea><p class="note">بيتسجل باليوم ده، وتقدر تعدله قبل ما اليوم يخلص.</p><button class="btn" onclick="closeSave()">حفظ وقفل اليوم</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`}
  else if(S.sheet==='cust'){const id=S.cid,ci=custInfo(id),es=L.entries.filter(e=>e.account==='customer:'+id),byDay={};let run=0;
    es.forEach(e=>{run+=sg(e);const key=dayKey(e.at);(byDay[key]=byDay[key]||{es:[],end:0}).es.push(e);byDay[key].end=run});
    b=`<h2>${esc(L.cust[id]||'')}</h2><div class="grid"><div class="card"><b>${fmt(ci.debt)}</b><span>المديونية</span></div><div class="card"><b class="pos">${fmt(ci.paid)}</b><span>المدفوع</span></div><div class="card"><b class="${ci.rem>0?'neg':''}">${fmt(ci.rem)}</b><span>المتبقي</span></div></div>${Object.keys(byDay).sort().reverse().map(key=>{const d=byDay[key];return `<h2>${dayLbl(key)}</h2><div class="tblw"><table>${d.es.slice().reverse().map(e=>`<tr><td>${new Date(e.at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</td><td>${e.kind==='reversal'?'قيد عكسي':(TYPES[e.kind]||'رصيد افتتاحي')}</td><td class="${e.sign>0?'neg':'pos'}">${e.sign>0?'+':'−'}${fmt(e.amount)}</td></tr>`).join('')}<tr><td colspan="2"><b>المتبقي آخر اليوم</b></td><td><b>${fmt(d.end)}</b></td></tr></table></div>`}).join('')||'<p class="note">لا توجد حركات لهذا العميل</p>'}<br><button class="btn sec" onclick="closeSheet()">إغلاق</button>`}
  else if(S.sheet==='topup'){b=`<h2>إضافة فلوس على عملاء موجودين</h2><p class="note">اكتب المبلغ اللي هيتضاف قدام كل عميل (سيب الباقي فاضي). المبلغ بيتضاف على المتبقي عليه، وبعدها يظهر للمساعد في التحصيل.</p><input placeholder="ابحث بالاسم أو الرقم" value="${esc(S.q||'')}" oninput="S.q=this.value;document.getElementById('tl').innerHTML=topList()"><div id="tl">${topList()}</div><p class="note">إجمالي الإضافة: <b id="tt">${fmt(topTotal())}</b></p><button class="btn" onclick="topSave()">حفظ</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`}
  else if(S.sheet==='opening'){b=`<h2>رصيد افتتاحي</h2><select id="oa"><option value="assistantCash">عهدة أخي</option><option value="abuOdayCash">خزنة أبو عدي</option></select><br><br><input id="ov" type="number" inputmode="decimal" placeholder="المبلغ بالجنيه"><br><br><button class="btn" onclick="doOpening()">حفظ</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`}
  else{const voice=S.sheet==='voice'&&!S.draft.length;
    b=`<h2>${S.sheet==='voice'?'سجّل بالصوت':S.sheet==='collection'?'تحصيل جديد':S.sheet==='distribute'?'توزيع أبو عدي (سطر لكل شخص)':S.sheet==='abuReturn'?'استرداد من أبو عدي':'تسليم لأبو عدي'}</h2>`+(voice?`${S.msg?`<div class="msg">${S.msg}</div>`:''}<button class="mic" style="padding:20px;font-size:20px" onclick="rec()">${S.rec?'⏹️ إيقاف':'🎙️ اضغط وتكلم'}</button><textarea id="tx" rows="4" placeholder="أو اكتب: خدت من أحمد 10 آلاف، وسلمت أبو عدي 5000">${esc(S.text)}</textarea><p class="note">لا يُحفظ شيء قبل تأكيدك.</p><button class="btn" onclick="analyze()">حلّل</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`:
    `${S.msg?`<div class="msg">${S.msg}</div>`:''}<p class="note">مراجعة قبل الحفظ</p>${S.draft.map((d,i)=>`<div class="item">${nameField(d,i)}<select onchange="S.draft[${i}].type=this.value;render()">${Object.entries(TYPES).map(([x,v])=>`<option value="${x}" ${x===d.type?'selected':''}>${v}</option>`).join('')}</select><input type="number" inputmode="decimal" value="${d.amt!=null?d.amt/100:''}" placeholder="المبلغ" onchange="S.draft[${i}].amt=Math.round(this.value*100)||null"><button class="btn x" onclick="S.draft.splice(${i},1);render()">✕</button></div>${d.type==='abuOdayExpense'?`<input list="dl" value="${esc(d.dest||'')}" placeholder="فين راحت الفلوس؟ (كاش / خط / محفظة...)" onchange="S.draft[${i}].dest=this.value.trim()">`:''}${d.amt==null?'<div class="note neg">لم أفهم المبلغ، اكتبه من فضلك</div>':''}${!d.person&&!['handover','abuReturn'].includes(d.type)?'<div class="note neg">مين الشخص؟</div>':''}${d.hint?'<div class="note neg">'+d.hint+'</div>':''}`).join('')}<datalist id="dl">${DESTS.map(x=>`<option value="${x}">`).join('')}</datalist><p class="note">الإجمالي: ${fmt(S.draft.filter(d=>d.amt).reduce((s,d)=>s+d.amt,0))}</p><button class="btn sec" onclick="addRow()">+ إضافة سطر</button><br><br><button class="btn" onclick="confirmDraft()">تأكيد الكل</button> <button class="btn sec" onclick="closeSheet()">إلغاء</button>`)}
  return `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div><i class="grab"></i>${b}</div></div>`}
window.openSheet=kd=>{S.sheet=kd;S.msg='';S.text='';S.draft=kd==='collection'?[{type:'collection',person:'',amt:null,id:uid()}]:kd==='handover'?[{type:'handover',person:'أبو عدي',amt:null,id:uid()}]:kd==='abuReturn'?[{type:'abuReturn',person:'أبو عدي',amt:null,id:uid()}]:kd==='distribute'?[{type:'abuOdayExpense',person:'',amt:null,dest:'كاش',id:uid()}]:[];S.bulk=null;S.q='';render()};
window.closeSheet=()=>{if(S.rec){S.rec.stop();S.rec=null}S.sheet=null;S.draft=[];S.text='';S.bulk=null;render()};
window.analyze=()=>{S.text=document.getElementById('tx').value;S.draft=parse(S.text).map(autoMatch);S.msg=S.draft.length?'تم التعرف على العمليات التالية:':'لم أفهم أي عملية، جرّب صياغة أوضح.';render()};
window.rec=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('المتصفح لا يدعم التعرف على الصوت، اكتب الكلام في المربع.');return}
  if(S.rec){S.rec.stop();return}const r=new SR();r.lang='ar-EG';r.continuous=true;r.interimResults=true;
  r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript+' ';const el=document.getElementById('tx');if(el)el.value=t};
  r.onend=()=>{const el=document.getElementById('tx');S.text=el?el.value:S.text;S.rec=null;if(S.sheet==='voice'&&!S.draft.length)render()};
  r.start();S.rec=r;render()};
const NC={};
function bulkCust(r){if(!r.cid){if(Object.values(L.cust).includes(r.name)&&confirm('«'+r.name+'» موجود بالفعل.\nموافق = عميل جديد منفصل بنفس الاسم\nإلغاء = إضافة المبلغ على العميل الموجود')){r.cid='c'+uid().slice(0,12);r.cnew=true}
  else{const c=custId(r.name);r.cid=c.id;r.cnew=c.isNew}}
  return{id:r.cid,isNew:r.cnew}}
function custId(name){for(const[i,n]of Object.entries(L.cust))if(n===name)return{id:i,isNew:false};if(!NC[name])NC[name]='c'+uid().slice(0,12);return{id:NC[name],isNew:true}}
window.confirmDraft=async()=>{const bad=S.draft.find(d=>d.amt==null||(!d.person&&!['handover','abuReturn'].includes(d.type)));if(bad){S.msg='أكمل الاسم والمبلغ أولًا.';render();return}
  const amb=S.draft.find(d=>(d.type==='collection'||d.type==='debt')&&!d.cid&&!d.forceNew&&Object.values(L.cust).filter(n=>n===d.person).length>1);
  if(amb){S.msg='في أكثر من عميل بنفس الاسم «'+amb.person+'»، اختر العميل الصحيح من القائمة.';amb.person='';amb.newMode=false;render();return}
  for(const d of S.draft)if((d.type==='collection'||d.type==='debt')&&!d.cid&&d.newMode&&d.fn===undefined&&Object.values(L.cust).includes(d.person)){d.fn=1;d.forceNew=confirm('في عميل بنفس الاسم «'+d.person+'».\nموافق = عميل جديد منفصل\nإلغاء = نفس العميل الموجود')}
  const src=S.text?'voice':'manual',failed=[];let pend=false;
  for(const d of S.draft){const op={opId:d.id,dest:d.dest||'',amount:d.amt,source:src,voiceText:S.text,party:['handover','abuReturn'].includes(d.type)?'أبو عدي':d.person,kind:d.type};
    if(d.type==='collection'||d.type==='debt'){let c;
      if(d.cid&&L.cust[d.cid])c={id:d.cid,isNew:false};
      else if(d.forceNew)c={id:d.nid||(d.nid='c'+uid().slice(0,12)),isNew:true};
      else c=custId(d.person);
      op.cid=c.id;op.newCust=c.isNew}
    let r=await post(op);
    if(!r.ok&&r.warn&&r.warn[0]!=='فشل الحفظ'&&r.warn[0]!=='المبلغ غير صالح'){if(confirm('تنبيه: '+r.warn.join('، ')+'\nهل تريد المتابعة وتسجيلها بموافقتك؟')){op.approved=true;r=await post(op)}else{failed.push(d);continue}}
    if(!r.ok)failed.push(d);else if(r.pending)pend=true}
  if(failed.length){S.draft=failed;S.msg='لم تُحفظ بعض العمليات، راجعها.'}else{S.sheet=null;S.draft=[];S.text='';alert(pend?'محفوظ على الجهاز ⏳ وفي انتظار المزامنة':'تم الحفظ ✅')}render()};
window.doOpening=async()=>{const v=Math.round(parseFloat(document.getElementById('ov').value)*100);const r=await post({opId:uid(),kind:'opening',amount:v,account:document.getElementById('oa').value});if(!r.ok){alert('تعذّر الحفظ');return}closeSheet()};
window.login=async()=>{try{S.err='';await signInWithEmailAndPassword(auth,document.getElementById('em').value.trim(),document.getElementById('pw').value)}catch(e){S.err='تعذّر الدخول: تأكد من الإيميل وكلمة السر ('+e.code+')';render()}};
window.logout=()=>signOut(auth);


window.addRow=()=>{S.draft.push({type:S.sheet==='distribute'?'abuOdayExpense':(S.draft[0]?S.draft[0].type:'collection'),person:'',amt:null,dest:'كاش',id:uid()});render()};
window.custList=()=>{const q=(S.q||'').trim();return Object.entries(L.cust).filter(([i,n])=>!q||n.includes(q)||(L.ph[i]||'').includes(q)).map(([i,n])=>({i,n,...custInfo(i)})).sort((a,b)=>b.rem-a.rem).map(c=>`<div class="card" onclick="openCust('${c.i}')" style="margin:6px 0;display:flex;justify-content:space-between;cursor:pointer"><span>${esc(c.n)}${L.ph[c.i]?` <span class="note">${esc(L.ph[c.i])}</span>`:''}</span><b class="${c.rem>0?'neg':''}">${fmt(c.rem)}</b></div>`).join('')||'<p class="note">لا يوجد عملاء</p>'};
window.searchC=v=>{S.q=v;document.getElementById('cl').innerHTML=custList()};
window.bulkParse=()=>{const rows=[];document.getElementById('bc').value.split('\n').forEach(l=>{l=ND(l.trim());if(!l)return;let ph='';const pm=l.match(/01\d{9}/);if(pm){ph=pm[0];l=l.replace(pm[0],'').trim()}
  const m=l.match(/^(.*?)[\s\-–:,،]*(\d[\d,.]*)\s*(ألف|الف|آلاف|الاف)?\s*$/);const name=(m?m[1]:l).trim();let amt=m?Math.round(parseFloat(m[2].replace(/,/g,''))*(m[3]?1000:1)*100):0;if(!(amt>0))amt=0;if(name)rows.push({name,amt,ph,id:uid()})});
  if(!rows.length){alert('اكتب شخصًا واحدًا على الأقل');return}S.bulk=rows;render()};
window.bulkSave=async()=>{let pend=false;for(const r of S.bulk){const c=bulkCust(r);
  if(r.amt>0){const x=await post({opId:r.id,kind:'opening',account:'customer:'+c.id,amount:r.amt,party:r.name,cid:c.id,newCust:c.isNew,phone:r.ph});if(!x.ok){alert('تعذّر حفظ '+r.name);return}if(x.pending)pend=true}
  else if(c.isNew){const b=writeBatch(db);b.set(doc(db,'customers',c.id),{name:r.name,phone:r.ph,at:new Date().toISOString()});const x=await commit(b);if(x.pending)pend=true}}
  S.bulk=null;S.sheet=null;alert(pend?'محفوظ على الجهاز ⏳ وفي انتظار المزامنة':'تم حفظ العملاء ✅');render()};
const dayLbl=key=>(key===dayKey(new Date())?'اليوم — ':'')+new Date(key+'T12:00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
window.dayStats=()=>{const m={},at0={};
  L.entries.forEach(e=>{if(e.kind!=='reversal')at0[e.opId+'_'+e.n]=e.at});
  L.entries.forEach(e=>{const key=dayKey(e.kind==='reversal'?(at0[e.opId.replace(/^rev-/,'')+'_'+e.n]||e.at):e.at),d=m[key]||(m[key]={col:0,hand:0,sp:0,rp:0,ret:0,net:0}),kd=k(e),A=e.account==='abuOdayCash';
    if(e.account==='assistantCash'&&kd==='collection')d.col+=sg(e);
    if(A&&kd==='handover')d.hand+=sg(e);
    if(A&&kd==='abuOdayExpense'&&e.status==='confirmed')d.sp-=sg(e);
    if(A&&kd==='abuReturn')d.ret-=sg(e);
    if(e.kind==='abuOdayExpense'&&e.status!=='confirmed')d.rp+=e.amount;
    if(A&&e.status==='confirmed')d.net+=sg(e)});
  Object.keys(L.close).forEach(key=>{if(!m[key])m[key]={col:0,hand:0,sp:0,rp:0,ret:0,net:0}});
  let run=0;return Object.keys(m).sort().map(key=>{run+=m[key].net;return{key,...m[key],bal:run}}).reverse()};
window.dailyLog=()=>{const D=dayStats();
  return `<h2>السجل اليومي (اضغط على اليوم للتفاصيل)</h2>${L.closeErr?'<div class="msg neg">مفيش صلاحية قراءة «قفل اليوم» ('+esc(L.closeErr)+')، ضيف قاعدة closings في Firebase Rules.</div>':''}<div class="tblw"><table><tr><th>اليوم</th><th>اتلم</th><th>اتسلّم لأبو عدي</th><th>أبو عدي صرف</th><th>اتسترد منه</th><th>رصيد أبو عدي</th><th>قفل اليوم</th></tr>${D.map(d=>`<tr style="cursor:pointer" onclick="openDay('${d.key}')"><td><b>${dayLbl(d.key)}</b></td><td class="pos">${fmt(d.col)}</td><td>${fmt(d.hand)}</td><td class="neg">${fmt(d.sp)}${d.rp>0?`<div class="note">+ ${fmt(d.rp)} مُبلَّغ</div>`:''}</td><td>${fmt(d.ret)}</td><td><b class="${d.bal<0?'neg':''}">${fmt(d.bal)}</b></td><td>${closeCell(d.key)}</td></tr>`).join('')||'<tr><td colspan="7" class="note">لا توجد حركات</td></tr>'}</table></div>`};
const closeCell=key=>{const c=L.close[key];return c?`<span class="pill ${c.done?'':'warn'}">${c.done?'خلّص مع أبو عدي':'لسه فيه فرق'}</span><div class="note" style="white-space:normal;min-width:160px">${esc(c.note)}</div>`:(key===dayKey(new Date())?'<span class="note">لسه</span>':'<span class="pill bad">لم يُقفل</span>')};
window.closeDetail=key=>{const c=L.close[key];return `<h2>قفل اليوم</h2>`+(c?`<div class="card" style="margin:6px 0"><span class="pill ${c.done?'':'warn'}">${c.done?'خلّص مع أبو عدي':'لسه فيه فرق'}</span><p style="white-space:pre-wrap;margin:8px 0">${esc(c.note)}</p><div class="note">عهدة أخي وقت القفل: ${fmt(c.assistantCash||0)} — رصيد أبو عدي: ${fmt(c.abuBal||0)}<br>${esc(c.byEmail||'')} — ${c.at?new Date(c.at).toLocaleString('ar-EG'):''}</div></div>`:'<div class="msg">اليوم ده لم يُقفل</div>')};
window.closeBox=()=>{const key=dayKey(new Date()),c=L.close[key],late=new Date().getHours()>=23;
  if(c)return `<div class="msg">✅ اليوم اتقفل — ${c.done?'خلصت مع أبو عدي':'لسه فيه فرق مع أبو عدي'}<div class="note" style="white-space:pre-wrap">${esc(c.note)}</div><button class="btn sec" onclick="openClose()">تعديل</button></div>`;
  if(late)return `<div class="msg warnbox"><b>⏰ آخر اليوم:</b> خلصت مع أبو عدي؟ والفلوس حوّلتها فين؟<br><br><button class="btn" onclick="openClose()">🔒 اقفل اليوم</button></div>`;
  return `<button class="closebtn" onclick="openClose()">🔒 قفل اليوم</button>`};
window.openClose=()=>{S.sheet='close';S.msg='';S.draft=[];S.bulk=null;render()};
window.closeSave=async()=>{const dn=document.getElementById('cl_done').value,note=document.getElementById('cl_note').value.trim();
  if(dn===''){alert('اختار: خلصت مع أبو عدي ولا لأ');return}
  if(!note){alert('اكتب الفلوس اتحولت فين');return}
  const key=dayKey(new Date()),b=writeBatch(db);
  b.set(doc(db,'closings',key),{day:key,done:dn==='1',note,assistantCash:bal('assistantCash'),abuBal:bal('abuOdayCash'),by:auth.currentUser.uid,byEmail:auth.currentUser.email,at:new Date().toISOString()});
  const r=await commit(b);if(!r.ok){alert('تعذّر الحفظ، تأكد من صلاحية closings في Firebase');return}
  S.sheet=null;alert(r.pending?'محفوظ على الجهاز ⏳ وفي انتظار المزامنة':'اليوم اتقفل ✅');render()};
window.openCust=id=>{S.sheet='cust';S.cid=id;S.msg='';S.draft=[];S.bulk=null;render()};
window.openDay=d=>{S.sheet='day';S.day=d;S.msg='';S.draft=[];S.bulk=null;render()};
window.openTopup=id=>{S.sheet='topup';S.msg='';S.draft=[];S.bulk=null;S.topup={};S.q=id&&L.cust[id]?L.cust[id]:'';render()};
window.topTotal=()=>Object.values(S.topup).reduce((s,x)=>s+x,0);
window.topList=()=>{const q=(S.q||'').trim();return Object.entries(L.cust).filter(([i,n])=>!q||n.includes(q)||(L.ph[i]||'').includes(q)).map(([i,n])=>({i,n,...custInfo(i)})).sort((a,b)=>a.n.localeCompare(b.n,'ar')).map(c=>`<div class="card" style="margin:6px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(c.n)}${L.ph[c.i]?` <span class="note">${esc(L.ph[c.i])}</span>`:''}</span><span class="note">متبقي ${fmt(c.rem)}</span></div><input type="number" inputmode="decimal" placeholder="المبلغ اللي هيتضاف بالجنيه" value="${S.topup[c.i]!=null?S.topup[c.i]/100:''}" oninput="topSet('${c.i}',this.value)"></div>`).join('')||'<p class="note">لا يوجد عملاء</p>'};
window.topSet=(i,v)=>{const a=Math.round(parseFloat(v)*100);if(a>0)S.topup[i]=a;else delete S.topup[i];const el=document.getElementById('tt');if(el)el.textContent=fmt(topTotal())};
window.topSave=async()=>{const ids=Object.keys(S.topup).filter(i=>L.cust[i]);if(!ids.length){alert('اكتب مبلغ لعميل واحد على الأقل');return}
  if(!confirm('هتتضاف فلوس على '+ids.length+' عميل بإجمالي '+fmt(topTotal())+'. تأكيد؟'))return;
  const at=new Date().toISOString(),b=writeBatch(db);
  ids.forEach(i=>{const opId=uid();b.set(doc(db,'entries',opId+'_0'),{opId,kind:'debt',account:'customer:'+i,amount:S.topup[i],sign:1,party:L.cust[i],status:'confirmed',note:'إضافة على عميل موجود',at,by:auth.currentUser.uid,byEmail:auth.currentUser.email,source:'manual',voiceText:'',dest:'',ts:serverTimestamp(),n:0})});
  const r=await commit(b);if(!r.ok){alert('تعذّر الحفظ، حاول تاني');return}
  S.sheet=null;S.topup={};S.q='';alert(r.pending?'محفوظ على الجهاز ⏳ وفي انتظار المزامنة':'تم الحفظ ✅');render()};
window.abuStmt=()=>{const E=L.entries.filter(e=>e.account==='abuOdayCash'&&k(e)==='abuOdayExpense'&&e.status==='confirmed');
  const grp=f=>{const m={};E.forEach(e=>{const key=f(e)||'غير محدد';m[key]=(m[key]||0)-sg(e)});return Object.entries(m).filter(x=>x[1]!==0).sort((a,b)=>b[1]-a[1])};
  const tb=(t,g)=>`<div class="tblw"><table><tr><th>${t}</th><th>الإجمالي</th></tr>${g.map(([n,v])=>`<tr><td>${esc(n)}</td><td><b>${fmt(v)}</b></td></tr>`).join('')||'<tr><td colspan="2" class="note">لا يوجد</td></tr>'}</table></div>`;
  return `<h2>كشف أبو عدي: لمين صُرف وفين</h2>${tb('لمين',grp(e=>e.party))}<br>${tb('الوجهة',grp(e=>e.dest))}`};

window.exportCSV=()=>{const acct=a=>a.startsWith('customer:')?(L.cust[a.slice(9)]||'عميل'):a==='assistantCash'?'عهدة أخي':a==='abuOdayCash'?'خزنة أبو عدي':a;
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['الوقت','النوع','الحساب','الطرف','الوجهة','الإشارة','المبلغ','الحالة','المصدر','بواسطة','معرف العملية']].concat(L.entries.map(e=>[e.at,e.kind==='reversal'?'قيد عكسي ('+(TYPES[e.origKind]||e.origKind)+')':(TYPES[e.kind]||e.kind),acct(e.account),e.party,e.dest,e.sign>0?'+':'-',e.amount/100,e.status,e.source,e.byEmail,e.opId]));
  const cs=[['العميل','الهاتف','المديونية','المدفوع','المتبقي']].concat(Object.keys(L.cust).map(i=>{const c=custInfo(i);return[L.cust[i],L.ph[i]||'',c.debt/100,c.paid/100,c.rem/100]}));
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')+'\n\n'+cs.map(r=>r.map(q).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ledger-'+dayKey(new Date())+'.csv';document.body.appendChild(a);a.click();a.remove()};
const entRef=e=>doc(db,'entries',e.opId+'_'+e.n);
async function delDocs(refs){for(let i=0;i<refs.length;i+=400){const b=writeBatch(db);refs.slice(i,i+400).forEach(r=>b.delete(r));const x=await commit(b);if(!x.ok)return false}return true}
window.delOp=async opId=>{const es=L.entries.filter(e=>e.opId===opId||e.opId==='rev-'+opId);if(!es.length)return;
  const me=auth.currentUser.uid;
  if(S.role!=='admin'&&es.some(e=>e.by!==me)){alert('لا يمكنك حذف هذه العملية، اطلب من المدير');return}
  if(!confirm('حذف هذه العملية نهائيًا من الدفتر؟ لا يمكن التراجع.'))return;
  const f=es.find(e=>e.n===0&&e.kind!=='reversal')||es[0],b=writeBatch(db);
  es.forEach(e=>b.delete(entRef(e)));
  b.set(doc(db,'deletions',uid()),{opId,kind:f.kind,amount:f.amount,party:f.party||'',dest:f.dest||'',by:me,byEmail:auth.currentUser.email,at:new Date().toISOString(),entryAt:f.at});
  await commit(b);render()};
window.delCust=async id=>{const a='customer:'+id,ops=new Set();
  if(L.entries.some(e=>e.account===a&&k(e)==='collection')){alert('هذا العميل عليه تحصيلات مسجلة، وحذفه هيمسح قيود عهدة المساعد المرتبطة بها ويبوّظ الأرصدة.\nاحذف عمليات التحصيل الخاصة به أولًا من «سجل جميع الحركات»، أو استخدم «مسح كل البيانات» لو دي بيانات تجريبية.');return}
  L.entries.filter(e=>e.account===a).forEach(e=>{ops.add(e.opId);ops.add('rev-'+e.opId);if(e.opId.startsWith('rev-'))ops.add(e.opId.slice(4))});
  const es=L.entries.filter(e=>ops.has(e.opId));
  if(!confirm('حذف العميل «'+(L.cust[id]||'')+'» نهائيًا مع '+es.length+' حركة (بما فيها قيود عهدة أخي المرتبطة بتحصيلاته)؟ لا يمكن التراجع.'))return;
  const lb=writeBatch(db);lb.set(doc(db,'deletions',uid()),{opId:'cust-'+id,kind:'customer',amount:custInfo(id).rem,party:L.cust[id]||'',dest:'',by:auth.currentUser.uid,byEmail:auth.currentUser.email,at:new Date().toISOString()});await commit(lb);
  await delDocs(es.map(entRef).concat([doc(db,'customers',id)]))};
window.delAll=async()=>{if(!confirm('سيتم تنزيل نسخة احتياطية (Excel) أولًا ثم طلب تأكيد المسح. متابعة؟'))return;exportCSV();
  if(prompt('اكتب كلمة: مسح   لتأكيد حذف كل العملاء والحركات نهائيًا')!=='مسح')return;
  {const lb=writeBatch(db);lb.set(doc(db,'deletions',uid()),{opId:'all-'+uid(),kind:'all',amount:0,party:'مسح كل البيانات ('+L.entries.length+' قيد، '+Object.keys(L.cust).length+' عميل)',dest:'',by:auth.currentUser.uid,byEmail:auth.currentUser.email,at:new Date().toISOString()});await commit(lb)}
  const ok=await delDocs(L.entries.map(entRef).concat(Object.keys(L.cust).map(i=>doc(db,'customers',i))));if(ok)alert('تم المسح، ابدأ من جديد')};

window.nameField=(d,i)=>{
  if(d.type==='collection'||d.type==='debt'){
    const list=Object.entries(L.cust).map(([id,n])=>({id,n,ph:L.ph[id]||'',rem:custInfo(id).rem})).filter(c=>d.type==='debt'||c.rem>0||c.id===d.cid).sort((a,b)=>b.rem-a.rem);
    const known=d.cid&&L.cust[d.cid];
    if(!d.newMode&&(known||!d.person)&&list.length)
      return `<select onchange="pickName(${i},this.value)"><option value="">اختر من العملاء</option>${list.map(c=>`<option value="${c.id}" ${c.id===d.cid?'selected':''}>${esc(c.n)}${c.ph?' · '+esc(c.ph):''} — متبقي ${fmt(c.rem)}</option>`).join('')}<option value="__new">➕ شخص جديد</option></select>`;
  }
  return `<input value="${esc(d.person)}" placeholder="الاسم" onchange="S.draft[${i}].person=this.value.trim();S.draft[${i}].cid=''">`};
window.pickName=(i,v)=>{const d=S.draft[i];if(v==='__new'){d.person='';d.cid='';d.newMode=true}else if(v){d.cid=v;d.person=L.cust[v]||'';d.newMode=false}else{d.cid='';d.person=''}d.hint='';render()};
window.autoMatch=d=>{if((d.type==='collection'||d.type==='debt')&&d.person){const es=Object.entries(L.cust);
  let c=es.filter(([i,n])=>n===d.person);if(!c.length)c=es.filter(([i,n])=>n.split(' ')[0]===d.person||n.startsWith(d.person));
  if(c.length===1){d.person=c[0][1];d.cid=c[0][0]}else if(c.length>1){d.person='';d.hint='في أكثر من شخص بنفس الاسم، اختر الصحيح'}}return d};

window.delLog=()=>L.del.length?`<h2>آخر العمليات المحذوفة</h2><div class="tblw"><table><tr><th>وقت الحذف</th><th>النوع</th><th>الطرف</th><th>المبلغ</th><th>حذفها</th></tr>${L.del.slice(0,30).map(d=>`<tr><td>${new Date(d.at).toLocaleString('ar-EG')}</td><td>${esc(({customer:'حذف عميل',all:'مسح كل البيانات'})[d.kind]||TYPES[d.kind]||d.kind)}</td><td>${esc(d.party)}</td><td>${fmt(d.amount)}</td><td>${d.byEmail===ADMIN_EMAIL?'المدير':'المساعد'}</td></tr>`).join('')}</table></div>`:'';
onAuthStateChanged(auth,u=>{unsubs.forEach(f=>f());unsubs=[];L.entries=[];L.cust={};L.ph={};L.del=[];L.close={};L.closeErr='';L.ready=false;S.err='';S.user=u;S.role=u?(u.email===ADMIN_EMAIL?'admin':'assistant'):null;S.view='assistant';
  if(u){unsubs.push(onSnapshot(collection(db,'entries'),{includeMetadataChanges:true},s=>{L.entries=s.docs.map(d=>{const x=d.data({serverTimestamps:'estimate'});if(x.ts&&x.ts.toDate)x.at=x.ts.toDate().toISOString();delete x.ts;return x}).sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:(a.n||0)-(b.n||0));L.ready=true;S.err='';L.pending=s.metadata.hasPendingWrites;L.cache=s.metadata.fromCache;if(!S.sheet)render()},e=>{S.err='لا توجد صلاحية قراءة أو تعذّر التحميل: '+e.code;render()}));
    unsubs.push(onSnapshot(collection(db,'customers'),s=>{L.cust={};L.ph={};s.docs.forEach(d=>{L.cust[d.id]=d.data().name;L.ph[d.id]=d.data().phone||''});if(!S.sheet)render()},e=>{S.err='تعذّر تحميل العملاء: '+e.code;render()}))
    unsubs.push(onSnapshot(collection(db,'closings'),s=>{L.close={};L.closeErr='';s.docs.forEach(d=>{L.close[d.id]=d.data()});if(!S.sheet)render()},e=>{L.closeErr=e.code||'error'}))
    if(S.role==='admin')unsubs.push(onSnapshot(collection(db,'deletions'),s=>{L.del=s.docs.map(d=>d.data()).sort((a,b)=>a.at<b.at?1:-1);if(!S.sheet)render()}))}
  render()});
setInterval(()=>{if(!S.user||!L.ready||S.sheet||S.role!=='assistant')return;const key=dayKey(new Date());if(new Date().getHours()>=23&&!L.close[key]&&S.asked!==key){S.asked=key;openClose()}},30000);
window.addEventListener('online',render);window.addEventListener('offline',render);
</script>
</body>
